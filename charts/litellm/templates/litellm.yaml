---
# LiteLLM proxy — unified OpenAI-compatible gateway across all models.
# Reads its model list from PostgreSQL (managed via /model/new at runtime);
# the KRO register Jobs add models dynamically. Logs to Langfuse + OTLP.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  LITELLM_MASTER_KEY: {{ .Values.masterKey | quote }}
  LITELLM_SALT_KEY: {{ .Values.saltKey | quote }}
  DATABASE_URL: {{ include "litellm.databaseUrl" . | quote }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.langfuse.publicKey | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.langfuse.secretKey | quote }}
  LANGFUSE_HOST: {{ .Values.langfuse.host | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: {{ .Values.namespace }}
data:
  config.yaml: |
    # Initial config — empty model list; models added at runtime by the KRO
    # register Jobs (POST /model/new).
    model_list: []

    litellm_settings:
      telemetry: false
      success_callback:
        - otel
      failure_callback:
        - otel
      num_retries: 2
      request_timeout: 600
      drop_params: true
      modify_params: true

    general_settings:
      store_model_in_db: true
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      default_team_settings:
        - team_id: default
          max_budget: 100.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "litellm.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "litellm.name" . }}
  template:
    metadata:
      labels:
        {{- include "litellm.labels" . | nindent 8 }}
      annotations:
        # Restart the pod when the secret (master key, DB URL, Langfuse keys)
        # changes — envFrom secret changes don't trigger a rollout on their own.
        checksum/secrets: {{ printf "%s|%s|%s|%s|%s|%s" .Values.masterKey .Values.saltKey (include "litellm.databaseUrl" .) .Values.langfuse.host .Values.langfuse.publicKey .Values.langfuse.secretKey | sha256sum }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.waitImage }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ .Values.database.host }} -U {{ .Values.database.user }}; do
                echo "Waiting for postgres..."
                sleep 3
              done
      containers:
        - name: {{ include "litellm.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--config=/etc/litellm/config.yaml"
            - "--port={{ .Values.service.port }}"
            - "--num_workers=4"
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          envFrom:
            - secretRef:
                name: litellm-secrets
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: LITELLM_LOG
              value: INFO
            - name: OTEL_EXPORTER
              value: "otlp_grpc"
            - name: OTEL_ENDPOINT
              value: {{ .Values.otelEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otelEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              value: "litellm-proxy"
            - name: LITELLM_OTEL_V2
              value: "false"
            - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
              value: "SPAN_ONLY"
            - name: LITELLM_OTEL_INTEGRATION_ENABLE_EVENTS
              value: "true"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace={{ .Values.namespace }},deployment.environment=poc"
            - name: OTEL_TRACES_SAMPLER
              value: "always_on"
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "litellm.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "litellm.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "litellm.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    release: {{ .Values.serviceMonitor.releaseLabel }}
spec:
  selector:
    matchLabels:
      app: {{ include "litellm.name" . }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
