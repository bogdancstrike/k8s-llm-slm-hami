---
# Qwen2.5 1.5B AWQ — public GPU model exposed as the local "quality" slot.
#
# vRAM budget:
#   Weights (AWQ INT4):       ~1.8 GB
#   KV cache (max_len=2048):  ~1.0 GB
#   Activations + CUDA ctx:   ~1.8 GB
#   ─────────────────────────────────
#   Total:                    ~4.6 GB  → fits in 5GB HAMi slice (tight)
#
# Not gated — no HuggingFace token required. Public model.
apiVersion: kro.run/v1alpha1
kind: InferenceEndpoint
metadata:
  name: smollm3-3b
  namespace: inference
spec:
  # Backend selection — GPU inference via vLLM
  backend: vllm

  model: "Qwen/Qwen2.5-1.5B-Instruct-AWQ"
  servedName: "qwen25-1.5b-awq"

  gpuMemMb: 5000
  gpuMemPercentage: 40
  gpuCorePercent: 45

  quantization: "awq"
  maxModelLen: 2048
  gpuMemUtilization: "0.80"

  cpuRequest: "1"
  cpuLimit: "2"
  memoryRequest: "4Gi"
  memoryLimit: "8Gi"

  minReplicas: 1
  maxReplicas: 1

  litellmAlias: "smollm3-3b-quality"
