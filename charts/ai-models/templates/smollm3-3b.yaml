---
# Qwen2.5 0.5B AWQ — second public GPU model exposed as the local "quality" slot.
# Ships without a tokenizer chat template — the vLLM runtime falls back to ChatML.
apiVersion: kro.run/v1alpha1
kind: InferenceEndpoint
metadata:
  name: smollm3-3b
  namespace: {{ .Values.namespace }}
spec:
  backend: vllm
  model: "Qwen/Qwen2.5-0.5B-Instruct-AWQ"
  servedName: "qwen25-0.5b-awq"

  gpuCards: 1
  gpuMemMb: 6500
  # Bumped 30→40% so the KV cache fits maxModelLen below. At 30% (~3GB slice)
  # vLLM could only hold ~15.4k KV tokens; 40% (~4GB) gives comfortable headroom
  # for 16384. Budget on the 10GB 3080: gemma 30% + smollm 40% = 70% (~7GB).
  gpuMemPercentage: 40
  gpuCorePercent: 35

  quantization: "awq"
  # Qwen2.5-0.5B supports up to 32768, but the KV cache for the full window does
  # not fit this GPU slice. 16384 comfortably covers OpenCode (its prompt is
  # ~9.6k tokens) plus a multi-thousand-token reply, and fits the 40% slice.
  # Keep this in sync with opencode.json's smollm3-3b-quality context limit.
  maxModelLen: 16384
  gpuMemUtilization: "0.85"

  cpuRequest: "1"
  cpuLimit: "2"
  memoryRequest: "4Gi"
  memoryLimit: "8Gi"

  minReplicas: 1
  maxReplicas: 1

  litellmAlias: "smollm3-3b-quality"
{{- include "ai-models.registerJob" (dict
      "name" "smollm3-3b" "alias" "smollm3-3b-quality" "served" "qwen25-0.5b-awq"
      "backend" "vllm" "desc" "Qwen/Qwen2.5-0.5B-Instruct-AWQ via KServe + vLLM GPU"
      "root" $) }}
