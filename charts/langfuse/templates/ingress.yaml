---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langfuse
  namespace: ai-platform
spec:
  ingressClassName: public
  rules:
    - host: langfuse.local.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: langfuse
                port:
                  name: http
