{{- if .Values.secretMirror.enabled }}
---
# Copy of the LiteLLM master key in the `inference` namespace, where the KRO
# register Jobs run (Secrets are namespace-scoped). Prod: External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: {{ .Values.secretMirror.namespace }}
type: Opaque
stringData:
  LITELLM_MASTER_KEY: {{ .Values.masterKey | quote }}
{{- end }}
