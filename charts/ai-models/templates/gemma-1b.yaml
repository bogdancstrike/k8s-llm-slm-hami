---
# Qwen2.5-Coder 1.5B AWQ — small coding-tuned GPU model in the local "gemma" slot.
#
# Replaced the original TinyLlama-1.1B (2048-token context), which was too small
# for coding agents: OpenCode's ~10k-token tool/system prompt overflowed the
# window every turn and trapped it in a compaction loop. Qwen2.5-Coder-1.5B has a
# 32768 native context and supports hermes-style tool calling — ideal for OpenCode.
#
# Drop a file like this in templates/ and apply the chart (or `kubectl apply`
# the rendered CR): KRO expands it into a KServe InferenceService (the model)
# plus a LiteLLM registration Job (auto-registers the alias across the stack).
#
# Public model: no Hugging Face token is required.
apiVersion: kro.run/v1alpha1
kind: InferenceEndpoint
metadata:
  name: gemma-1b
  namespace: {{ .Values.namespace }}
spec:
  # Backend — vllm runs on GPU (HAMi vGPU partitioning)
  backend: vllm
  model: "Qwen/Qwen2.5-Coder-1.5B-Instruct-AWQ"
  servedName: "gemma-1b"

  # GPU allocation via HAMi
  # gpuCards = vLLM tensor-parallel size (1 = single GPU; 2+ shards across cards)
  gpuCards: 1
  gpuMemMb: 6500
  # 40% (~4GB) so a 1.5B model's weights + a 16384 KV cache fit with headroom.
  # Budget on the 10GB 3080: gemma 40% + smollm 40% = 80% (~8GB), cores 35%+35%.
  gpuMemPercentage: 40
  gpuCorePercent: 35

  quantization: "awq"
  # Qwen2.5-Coder-1.5B supports 32768; 16384 covers OpenCode (its prompt is ~10k
  # tokens) plus a multi-thousand-token reply, and fits the 40% slice. Keep in
  # sync with opencode.json's gemma-1b-fast context limit.
  maxModelLen: 16384
  gpuMemUtilization: "0.85"
  # --enforce-eager: the 1.5B model + 16384 KV fills the 40% VRAM slice (~1.05x
  # concurrency) with no room for CUDA-graph capture, so skip it (small latency
  # cost). --swap-space 2: shrink vLLM's CPU KV cache from the 4GB default to keep
  # host RAM in check.
  extraArgs: "--enforce-eager --swap-space 2"

  cpuRequest: "1"
  cpuLimit: "2"
  # The 1.5B model + vLLM's CPU swap cache + CUDA host memory OOM-killed the pod
  # at 8Gi (exit 137). Raised to 12Gi (host RAM is plentiful; no GPU impact).
  memoryRequest: "6Gi"
  memoryLimit: "12Gi"

  minReplicas: 1
  maxReplicas: 1

  # Alias shown in Open WebUI / LiteLLM
  litellmAlias: "gemma-1b-fast"
{{- include "ai-models.registerJob" (dict
      "name" "gemma-1b" "alias" "gemma-1b-fast" "served" "gemma-1b"
      "backend" "vllm" "desc" "Qwen/Qwen2.5-Coder-1.5B-Instruct-AWQ via KServe + vLLM GPU"
      "root" $) }}
