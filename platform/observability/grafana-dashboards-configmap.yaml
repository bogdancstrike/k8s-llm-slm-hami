---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qsint-hami-dashboard
  namespace: monitoring
  labels:
    # Grafana sidecar in kube-prometheus-stack auto-loads ConfigMaps with this label
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "QSINT"
data:
  hami-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.0.0",
          "targets": [
            {
              "expr": "100 * sum(hami_vgpu_memory_used_bytes) / sum(hami_vgpu_memory_capacity_bytes)",
              "refId": "A"
            }
          ],
          "title": "Total vRAM Utilization",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "count(count by (pod) (hami_vgpu_memory_used_bytes{pod!=\"\"}))",
              "refId": "A"
            }
          ],
          "title": "Active Pods using vGPU",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 75 }
                ]
              },
              "unit": "celsius"
            }
          },
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            }
          },
          "targets": [
            {
              "expr": "hami_gpu_temperature_celsius",
              "refId": "A"
            }
          ],
          "title": "GPU Temperature",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null }
                ]
              },
              "unit": "watt"
            }
          },
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": ["lastNotNull"]
            }
          },
          "targets": [
            {
              "expr": "hami_gpu_power_watts",
              "refId": "A"
            }
          ],
          "title": "GPU Power Draw",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "vRAM (MB)",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 30,
                "gradientMode": "none",
                "hideFrom": { "tooltip": false, "viz": false, "legend": false },
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "normal" },
                "thresholdsStyle": { "mode": "off" }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green" }]
              },
              "unit": "decmbytes"
            }
          },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 6 },
          "id": 5,
          "options": {
            "legend": {
              "calcs": ["mean", "max"],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "hami_vgpu_memory_used_bytes / 1024 / 1024",
              "legendFormat": "{{pod}} ({{namespace}})",
              "refId": "A"
            }
          ],
          "title": "vRAM Usage per Pod (stacked)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisLabel": "Compute %",
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": false
              },
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green" }]
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 6 },
          "id": 6,
          "options": {
            "legend": {
              "calcs": ["mean", "max"],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "hami_vgpu_core_util_percent",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "GPU Compute Utilization per Pod",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": { "type": "auto" },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green" }]
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "vRAM Used (MB)" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "gauge", "mode": "gradient" } },
                  { "id": "max", "value": 10240 }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "vRAM Limit (MB)" },
                "properties": [
                  { "id": "unit", "value": "decmbytes" }
                ]
              }
            ]
          },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 15 },
          "id": 7,
          "options": {
            "footer": { "countRows": false, "fields": "", "reducer": ["sum"], "show": false },
            "showHeader": true,
            "sortBy": []
          },
          "targets": [
            {
              "expr": "hami_vgpu_memory_used_bytes / 1024 / 1024",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "expr": "hami_vgpu_memory_capacity_bytes / 1024 / 1024",
              "format": "table",
              "instant": true,
              "refId": "B"
            },
            {
              "expr": "hami_vgpu_core_util_percent",
              "format": "table",
              "instant": true,
              "refId": "C"
            }
          ],
          "title": "Per-Pod vGPU Allocation Table",
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "pod",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time 1": true, "Time 2": true, "Time 3": true,
                  "__name__ 1": true, "__name__ 2": true, "__name__ 3": true,
                  "endpoint 1": true, "endpoint 2": true, "endpoint 3": true,
                  "instance 1": true, "instance 2": true, "instance 3": true,
                  "job 1": true, "job 2": true, "job 3": true,
                  "service 1": true, "service 2": true, "service 3": true,
                  "container 1": true, "container 2": true, "container 3": true
                },
                "indexByName": {
                  "pod": 0,
                  "namespace 1": 1,
                  "Value #A": 2,
                  "Value #B": 3,
                  "Value #C": 4
                },
                "renameByName": {
                  "pod": "Pod",
                  "namespace 1": "Namespace",
                  "Value #A": "vRAM Used (MB)",
                  "Value #B": "vRAM Limit (MB)",
                  "Value #C": "Compute Util (%)"
                }
              }
            }
          ],
          "type": "table"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["qsint", "hami", "gpu"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "Prometheus", "value": "Prometheus" },
            "hide": 0,
            "includeAll": false,
            "label": "Datasource",
            "multi": false,
            "name": "DS_PROMETHEUS",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          }
        ]
      },
      "time": { "from": "now-30m", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "QSINT — HAMi vGPU Per-Pod",
      "uid": "qsint-hami-vgpu",
      "version": 1,
      "weekStart": ""
    }
    
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qsint-vllm-dashboard
  namespace: monitoring
  labels:
    # Grafana sidecar in kube-prometheus-stack auto-loads ConfigMaps with this label
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "QSINT"
data:
  vllm-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 5 },
                  { "color": "red", "value": 10 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "targets": [
            {
              "expr": "sum(vllm:num_requests_running)",
              "refId": "A"
            }
          ],
          "title": "Active Requests (All Models)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 20 }
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "targets": [
            {
              "expr": "sum(vllm:num_requests_waiting)",
              "refId": "A"
            }
          ],
          "title": "Queued Requests",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 80 },
                  { "color": "red", "value": 95 }
                ]
              },
              "unit": "percent",
              "max": 100,
              "min": 0
            }
          },
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "targets": [
            {
              "expr": "100 * avg(vllm:gpu_cache_usage_perc)",
              "refId": "A"
            }
          ],
          "title": "KV Cache Usage (avg)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green" }]
              },
              "unit": "ops"
            }
          },
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "targets": [
            {
              "expr": "sum(rate(vllm:request_success_total[1m]))",
              "refId": "A"
            }
          ],
          "title": "Request Rate (req/s)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisLabel": "tokens/s",
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "never"
              },
              "unit": "short"
            }
          },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 5 },
          "id": 5,
          "options": {
            "legend": {
              "calcs": ["mean", "max"],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "rate(vllm:prompt_tokens_total[1m])",
              "legendFormat": "{{model_name}} prompt tok/s",
              "refId": "A"
            },
            {
              "expr": "rate(vllm:generation_tokens_total[1m])",
              "legendFormat": "{{model_name}} generation tok/s",
              "refId": "B"
            }
          ],
          "title": "Token Throughput per Model",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisLabel": "ms",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "unit": "ms"
            }
          },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 5 },
          "id": 6,
          "options": {
            "legend": {
              "calcs": ["mean", "max"],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "expr": "1000 * histogram_quantile(0.50, sum by (model_name, le) (rate(vllm:time_to_first_token_seconds_bucket[5m])))",
              "legendFormat": "{{model_name}} TTFT p50",
              "refId": "A"
            },
            {
              "expr": "1000 * histogram_quantile(0.95, sum by (model_name, le) (rate(vllm:time_to_first_token_seconds_bucket[5m])))",
              "legendFormat": "{{model_name}} TTFT p95",
              "refId": "B"
            },
            {
              "expr": "1000 * histogram_quantile(0.99, sum by (model_name, le) (rate(vllm:time_to_first_token_seconds_bucket[5m])))",
              "legendFormat": "{{model_name}} TTFT p99",
              "refId": "C"
            }
          ],
          "title": "Time To First Token (TTFT)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisLabel": "ms",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "unit": "ms"
            }
          },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 14 },
          "id": 7,
          "options": {
            "legend": {
              "calcs": ["mean", "max"],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            }
          },
          "targets": [
            {
              "expr": "1000 * histogram_quantile(0.50, sum by (model_name, le) (rate(vllm:time_per_output_token_seconds_bucket[5m])))",
              "legendFormat": "{{model_name}} TPOT p50",
              "refId": "A"
            },
            {
              "expr": "1000 * histogram_quantile(0.95, sum by (model_name, le) (rate(vllm:time_per_output_token_seconds_bucket[5m])))",
              "legendFormat": "{{model_name}} TPOT p95",
              "refId": "B"
            }
          ],
          "title": "Time Per Output Token (TPOT)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisLabel": "%",
                "drawStyle": "line",
                "fillOpacity": 30,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "max": 100,
              "min": 0,
              "unit": "percent"
            }
          },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 14 },
          "id": 8,
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": ["mean", "max"]
            }
          },
          "targets": [
            {
              "expr": "100 * vllm:gpu_cache_usage_perc",
              "legendFormat": "{{model_name}} KV cache %",
              "refId": "A"
            },
            {
              "expr": "100 * vllm:cpu_cache_usage_perc",
              "legendFormat": "{{model_name}} CPU cache %",
              "refId": "B"
            }
          ],
          "title": "Cache Utilization",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["qsint", "vllm", "inference"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "Prometheus", "value": "Prometheus" },
            "hide": 0,
            "label": "Datasource",
            "name": "DS_PROMETHEUS",
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": { "from": "now-30m", "to": "now" },
      "title": "QSINT — vLLM Inference",
      "uid": "qsint-vllm-inference",
      "version": 1
    }
    
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qsint-litellm-dashboard
  namespace: monitoring
  labels:
    # Grafana sidecar in kube-prometheus-stack auto-loads ConfigMaps with this label
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "QSINT"
data:
  litellm-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green" }]
              },
              "unit": "ops"
            }
          },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "targets": [
            {
              "expr": "sum(rate(litellm_requests_total[1m]))",
              "refId": "A"
            }
          ],
          "title": "Total Request Rate",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "targets": [
            {
              "expr": "100 * sum(rate(litellm_requests_total{status=\"failure\"}[5m])) / sum(rate(litellm_requests_total[5m]))",
              "refId": "A"
            }
          ],
          "title": "Error Rate (5m)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
