---
# Shared PostgreSQL for LiteLLM + Langfuse (Platform DB pattern from AWS slides).
#
# Single-instance for PoC. For production:
#   - CloudNativePG operator (recommended)
#   - Patroni HA cluster
#   - Managed RDS/Cloud SQL
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ai-platform
type: Opaque
stringData:
  POSTGRES_USER: platform
  POSTGRES_PASSWORD: "ChangeMe-PoC-Only-2026"
  # Two logical databases on the same instance
  LITELLM_DB: litellm
  LANGFUSE_DB: langfuse
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: ai-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: microk8s-hostpath
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ai-platform
data:
  init.sql: |
    -- Create separate logical databases for LiteLLM and Langfuse
    CREATE DATABASE litellm;
    CREATE DATABASE langfuse;
    -- Grant privileges to the main user
    GRANT ALL PRIVILEGES ON DATABASE litellm TO platform;
    GRANT ALL PRIVILEGES ON DATABASE langfuse TO platform;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ai-platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: POSTGRES_DB
              # Default DB — actual app DBs created by init script
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "platform"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "platform"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-platform
spec:
  clusterIP: None    # Headless — required for StatefulSet
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
