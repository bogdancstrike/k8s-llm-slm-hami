---
# TinyLlama 1.1B AWQ — small fast GPU model exposed as the local "gemma" slot.
#
# Drop a file like this in templates/ and apply the chart (or `kubectl apply`
# the rendered CR): KRO expands it into a KServe InferenceService (the model)
# plus a LiteLLM registration Job (auto-registers the alias across the stack).
#
# Public model: no Hugging Face token is required.
apiVersion: kro.run/v1alpha1
kind: InferenceEndpoint
metadata:
  name: gemma-1b
  namespace: {{ .Values.namespace }}
spec:
  # Backend — vllm runs on GPU (HAMi vGPU partitioning)
  backend: vllm
  model: "TheBloke/TinyLlama-1.1B-Chat-v1.0-AWQ"
  servedName: "gemma-1b"

  # GPU allocation via HAMi
  # gpuCards = vLLM tensor-parallel size (1 = single GPU; 2+ shards across cards)
  gpuCards: 1
  gpuMemMb: 5000
  gpuMemPercentage: 30
  gpuCorePercent: 35

  quantization: "awq"
  maxModelLen: 2048
  gpuMemUtilization: "0.85"

  cpuRequest: "1"
  cpuLimit: "2"
  memoryRequest: "4Gi"
  memoryLimit: "8Gi"

  minReplicas: 1
  maxReplicas: 1

  # Alias shown in Open WebUI / LiteLLM
  litellmAlias: "gemma-1b-fast"
{{- include "ai-models.registerJob" (dict
      "name" "gemma-1b" "alias" "gemma-1b-fast" "served" "gemma-1b"
      "backend" "vllm" "desc" "TheBloke/TinyLlama-1.1B-Chat-v1.0-AWQ via KServe + vLLM GPU"
      "root" $) }}
