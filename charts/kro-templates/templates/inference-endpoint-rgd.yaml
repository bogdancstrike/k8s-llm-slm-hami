---
# KRO ResourceGraphDefinition — InferenceEndpoint CRD with multi-backend support.
#
# Supports two backends:
#   - backend: vllm     → GPU inference via KServe + vLLM ClusterServingRuntime
#                         Uses HAMi vGPU partitioning
#   - backend: llamacpp → CPU inference via KServe + llama.cpp ClusterServingRuntime
#                         No GPU resources requested
#
# The schema is unified — all fields are optional with sensible defaults.
# Developer fills only what's relevant for their chosen backend.
#
# Example minimal usage:
#
# # GPU model (vLLM backend, default):
# apiVersion: kro.run/v1alpha1
# kind: InferenceEndpoint
# metadata: {name: gemma-1b, namespace: inference}
# spec:
#   backend: vllm
#   model: "google/gemma-3-1b-it"
#   gpuMemMb: 5000
#   litellmAlias: "gemma-1b-fast"
#
# # CPU model (llama.cpp backend):
# apiVersion: kro.run/v1alpha1
# kind: InferenceEndpoint
# metadata: {name: qwen-cpu, namespace: inference}
# spec:
#   backend: llamacpp
#   modelFile: "qwen2.5-3b-instruct-q4_k_m.gguf"
#   modelUrl: "https://huggingface.co/.../qwen2.5-3b-instruct-q4_k_m.gguf"
#   cpuLimit: "8"
#   memoryLimit: "8Gi"
#   litellmAlias: "qwen-cpu-3b"
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: inference-endpoint
spec:
  schema:
    apiVersion: v1alpha1
    kind: InferenceEndpoint
    spec:
      # ─── Backend selection ─────────────────────────────────────────────
      # "vllm" (default) — GPU inference via vLLM runtime (HuggingFace model ID)
      # "llamacpp"       — CPU inference via llama.cpp runtime (GGUF file)
      backend: string | default="vllm"

      # ─── Common fields ─────────────────────────────────────────────────
      # Internal name used by the runtime's --served-model-name (vLLM) / --alias (llama.cpp)
      servedName: string | default="default"

      # Pod sizing — both backends use these
      cpuRequest: string | default="2"
      cpuLimit: string | default="4"
      memoryRequest: string | default="4Gi"
      memoryLimit: string | default="8Gi"

      # Autoscaling
      minReplicas: integer | default=1
      maxReplicas: integer | default=1

      # LiteLLM model alias — clients use this name in /v1/chat/completions
      litellmAlias: string | required=true

      # ─── vLLM-specific fields (used when backend=vllm) ─────────────────
      # HuggingFace model ID (e.g. "google/gemma-3-1b-it"). REQUIRED for vllm.
      model: string | default=""

      # Number of GPU cards to spread this model across (vLLM tensor parallelism).
      # 1 (default) = single GPU. N > 1 shards the model over N cards via
      # vLLM --tensor-parallel-size=N. Requires N schedulable GPU devices
      # (physical cards, or HAMi vGPU slices on multi-GPU nodes). The
      # gpuMemPercentage / gpuCorePercent sizing below is applied per card.
      # Ignored when backend=llamacpp (CPU only).
      gpuCards: integer | default=1

      # HAMi vGPU sizing — only applied when backend=vllm.
      # gpuMemMb is retained for docs/backward compatibility; MicroK8s HAMi
      # v2.8 uses gpumem-percentage to avoid Kubernetes quantity coercion.
      gpuMemMb: integer | default=5000
      gpuMemPercentage: integer | default=45
      gpuCorePercent: integer | default=50

      # vLLM tuning
      quantization: string | default="awq"
      maxModelLen: integer | default=2048
      gpuMemUtilization: string | default="0.85"

      # ─── llama.cpp-specific fields (used when backend=llamacpp) ────────
      # GGUF filename inside the model cache PVC (e.g. "qwen2.5-3b-instruct-q4_k_m.gguf")
      modelFile: string | default=""

      # URL to download the GGUF file from (typically HuggingFace direct link)
      # If file already exists in cache, download is skipped
      modelUrl: string | default=""

      # llama.cpp tuning
      ctxSize: integer | default=2048
      threads: integer | default=6
      batchSize: integer | default=512

    # Status — surfaces underlying resource state on the InferenceEndpoint CR
    status:
      endpointUrl: ${kserveInferenceService.status.url}

  # ───────────────────────────────────────────────────────────────────────
  # Resources — KRO generates these for every InferenceEndpoint CR
  # ───────────────────────────────────────────────────────────────────────
  resources:

    # ─── KServe InferenceService ─────────────────────────────────────────
    # The template handles BOTH backends via ${schema.spec.backend} interpolation.
    # KServe matches runtime via modelFormat.name → vllm-runtime OR llamacpp-runtime.
    - id: kserveInferenceService
      template:
        apiVersion: serving.kserve.io/v1beta1
        kind: InferenceService
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          annotations:
            serving.kserve.io/deploymentMode: "RawDeployment"
            serving.kserve.io/autoscalerClass: "hpa"
            # Mark backend in annotations for observability (Grafana labels, etc.)
            ai-platform/backend: ${schema.spec.backend}
        spec:
          predictor:
            minReplicas: ${schema.spec.minReplicas}
            maxReplicas: ${schema.spec.maxReplicas}
            # Recreate (terminate-before-create) instead of the default
            # RollingUpdate surge. A surge would briefly run old+new pods, each
            # holding a HAMi GPU slice (mem% + cores%) — two GPU models already
            # consume ~70% cores, so a 3rd surged slice exceeds 100% and the new
            # pod is stuck Pending with CardInsufficientCore. Recreate frees the
            # old slice first. Trade-off: brief downtime while the model reloads.
            deploymentStrategy:
              type: Recreate
            model:
              # KRO interpolates backend into modelFormat.name.
              # KServe then matches: vllm → vllm-runtime, gguf → llamacpp-runtime.
              # Note: we map "llamacpp" backend to "gguf" modelFormat for KServe.
              modelFormat:
                # CEL ternary: backend == "vllm" ? "vllm" : "gguf"
                name: '${schema.spec.backend == "vllm" ? "vllm" : "gguf"}'
              # Map backend → runtime name
              runtime: '${schema.spec.backend == "vllm" ? "vllm-runtime" : "llamacpp-runtime"}'

              # ─── Environment variables ─────────────────────────────────
              # Both sets of env vars are passed. The respective runtime ignores
              # the irrelevant ones (vLLM ignores MODEL_FILE, llama.cpp ignores MODEL_ID).
              # This avoids CEL conditional list construction which is fragile.
              env:
                # vLLM env vars
                - name: MODEL_ID
                  value: ${schema.spec.model}
                - name: SERVED_NAME
                  value: ${schema.spec.servedName}
                - name: QUANTIZATION
                  value: ${schema.spec.quantization}
                - name: MAX_MODEL_LEN
                  value: ${string(schema.spec.maxModelLen)}
                - name: GPU_MEM_UTIL
                  value: ${schema.spec.gpuMemUtilization}
                # vLLM tensor-parallel size — must match nvidia.com/gpu count below
                - name: TENSOR_PARALLEL_SIZE
                  value: ${string(schema.spec.gpuCards)}
                - name: EXTRA_ARGS
                  value: '${schema.metadata.name == "gemma-1b" ? "--served-model-name=gemma-1b" : "--enable-auto-tool-choice --tool-call-parser=hermes"}'
                # llama.cpp env vars
                - name: MODEL_FILE
                  value: ${schema.spec.modelFile}
                - name: MODEL_URL
                  value: ${schema.spec.modelUrl}
                - name: CTX_SIZE
                  value: ${string(schema.spec.ctxSize)}
                - name: THREADS
                  value: ${string(schema.spec.threads)}
                - name: BATCH_SIZE
                  value: ${string(schema.spec.batchSize)}

              # ─── Resources ─────────────────────────────────────────────
              # CEL conditional: GPU resources ONLY when backend=vllm.
              # When backend=llamacpp, nvidia.com/* keys are simply absent.
              # KServe ServingRuntime defaults take over (which for llamacpp-runtime
              # request only CPU+memory, no GPU).
              resources:
                requests:
                  cpu: ${schema.spec.cpuRequest}
                  memory: ${schema.spec.memoryRequest}
                  # Only request GPUs when vLLM, gpuCards of them (tensor parallelism).
                  # CEL: backend == "vllm" ? "<gpuCards>" : "0"
                  # KServe/Kubernetes interpret resource value "0" as "don't request".
                  nvidia.com/gpu: '${schema.spec.backend == "vllm" ? string(schema.spec.gpuCards) : "0"}'
                  nvidia.com/gpumem-percentage: '${schema.spec.backend == "vllm" ? string(schema.spec.gpuMemPercentage) : "0"}'
                  nvidia.com/gpucores: '${schema.spec.backend == "vllm" ? string(schema.spec.gpuCorePercent) : "0"}'
                limits:
                  cpu: ${schema.spec.cpuLimit}
                  memory: ${schema.spec.memoryLimit}
                  nvidia.com/gpu: '${schema.spec.backend == "vllm" ? string(schema.spec.gpuCards) : "0"}'
                  nvidia.com/gpumem-percentage: '${schema.spec.backend == "vllm" ? string(schema.spec.gpuMemPercentage) : "0"}'
                  nvidia.com/gpucores: '${schema.spec.backend == "vllm" ? string(schema.spec.gpuCorePercent) : "0"}'
