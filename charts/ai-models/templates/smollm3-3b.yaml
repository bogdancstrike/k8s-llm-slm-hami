---
# Qwen2.5 0.5B AWQ — second public GPU model exposed as the local "quality" slot.
# Ships without a tokenizer chat template — the vLLM runtime falls back to ChatML.
apiVersion: kro.run/v1alpha1
kind: InferenceEndpoint
metadata:
  name: smollm3-3b
  namespace: {{ .Values.namespace }}
spec:
  backend: vllm
  model: "Qwen/Qwen2.5-0.5B-Instruct-AWQ"
  servedName: "qwen25-0.5b-awq"

  gpuCards: 1
  gpuMemMb: 5000
  gpuMemPercentage: 30
  gpuCorePercent: 35

  quantization: "awq"
  # Qwen2.5-0.5B native context is 32768 — set to the full window so OpenCode's
  # large requests (prompt + completion) fit. KV cache for 0.5B at 32k is ~0.8GB.
  maxModelLen: 32768
  gpuMemUtilization: "0.85"

  cpuRequest: "1"
  cpuLimit: "2"
  memoryRequest: "4Gi"
  memoryLimit: "8Gi"

  minReplicas: 1
  maxReplicas: 1

  litellmAlias: "smollm3-3b-quality"
{{- include "ai-models.registerJob" (dict
      "name" "smollm3-3b" "alias" "smollm3-3b-quality" "served" "qwen25-0.5b-awq"
      "backend" "vllm" "desc" "Qwen/Qwen2.5-0.5B-Instruct-AWQ via KServe + vLLM GPU"
      "root" $) }}
