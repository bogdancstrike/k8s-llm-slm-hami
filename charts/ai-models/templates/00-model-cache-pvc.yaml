---
# Shared PVC for HuggingFace/GGUF model cache across all inference pods.
# Lives in this chart (not serving-runtimes) because microk8s-hostpath uses
# WaitForFirstConsumer — keeping the PVC with the first consuming pod avoids a
# `helm --wait` deadlock.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.modelCache.name }}
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - {{ .Values.modelCache.accessMode }}
  resources:
    requests:
      storage: {{ .Values.modelCache.size }}
  storageClassName: {{ .Values.modelCache.storageClass }}
