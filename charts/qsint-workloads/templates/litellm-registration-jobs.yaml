{{- $models := list
  (dict "name" "gemma-1b" "alias" "gemma-1b-fast" "servedName" "gemma-1b" "backend" "vllm" "description" "TheBloke/TinyLlama-1.1B-Chat-v1.0-AWQ via KServe + vLLM GPU")
  (dict "name" "smollm3-3b" "alias" "smollm3-3b-quality" "servedName" "tinyllama-1.1b-chat-v03" "backend" "vllm" "description" "TheBloke/TinyLlama-1.1B-Chat-v0.3-AWQ via KServe + vLLM GPU")
  (dict "name" "qwen25-3b-cpu" "alias" "qwen-3b-cpu" "servedName" "qwen25-3b-cpu" "backend" "llamacpp" "description" "Qwen2.5-3B-Instruct GGUF via KServe + llama.cpp CPU")
}}
{{- range $model := $models }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $model.name }}-litellm-register
  namespace: inference
  labels:
    app.kubernetes.io/name: qsint-workloads
    app.kubernetes.io/component: litellm-registration
    qsint.ai-platform/model: {{ $model.name }}
spec:
  backoffLimit: 30
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qsint-workloads
        app.kubernetes.io/component: litellm-registration
        qsint.ai-platform/model: {{ $model.name }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: curlimages/curl:8.10.1
          env:
            - name: MODEL_URL
              value: "http://{{ $model.name }}-predictor.inference.svc.cluster.local"
            - name: LITELLM_URL
              value: "http://litellm.ai-platform.svc.cluster.local:4000"
            - name: LITELLM_ALIAS
              value: {{ $model.alias | quote }}
            - name: SERVED_NAME
              value: {{ $model.servedName | quote }}
            - name: MODEL_ID_TAG
              value: {{ $model.name | quote }}
            - name: BACKEND
              value: {{ $model.backend | quote }}
            - name: MODEL_DESC
              value: {{ $model.description | quote }}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_MASTER_KEY
          command:
            - sh
            - -c
            - |
              set -eu

              echo "Waiting for $MODEL_URL/v1/models..."
              i=0
              while [ "$i" -lt 180 ]; do
                if curl -sf -o /tmp/models.json "$MODEL_URL/v1/models"; then
                  cat /tmp/models.json
                  break
                fi
                i=$((i + 1))
                sleep 10
              done

              if [ "$i" -eq 180 ]; then
                echo "ERROR: model endpoint did not become ready: $MODEL_URL"
                exit 1
              fi

              PAYLOAD=$(cat <<JSON
              {
                "model_name": "$LITELLM_ALIAS",
                "litellm_params": {
                  "model": "openai/$SERVED_NAME",
                  "api_base": "$MODEL_URL/v1",
                  "api_key": "dummy-not-required-for-self-hosted"
                },
                "model_info": {
                  "id": "$MODEL_ID_TAG",
                  "description": "$MODEL_DESC"
                }
              }
              JSON
              )

              curl -sf -X POST "$LITELLM_URL/model/new" \
                -H "Authorization: Bearer $LITELLM_MASTER_KEY" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD"

              echo
              echo "Registered $LITELLM_ALIAS"
{{- end }}
