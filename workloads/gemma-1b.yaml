---
# Gemma 3 1B Instruction-Tuned — small fast model.
#
# vRAM budget:
#   Weights (AWQ INT4):       ~0.6 GB
#   KV cache (max_len=2048):  ~0.5 GB
#   Activations + CUDA ctx:   ~1.5 GB
#   ─────────────────────────────────
#   Total:                    ~2.6 GB  → fits in 5GB HAMi slice with headroom
#
# Gemma is a GATED model. Before this syncs, you MUST:
#   1. Visit https://huggingface.co/google/gemma-3-1b-it and accept the license
#   2. Create a HuggingFace token: https://huggingface.co/settings/tokens
#   3. Set it as a secret:
#      kubectl create secret generic huggingface-token -n inference \
#        --from-literal=token=hf_YOUR_TOKEN_HERE
apiVersion: kro.run/v1alpha1
kind: InferenceEndpoint
metadata:
  name: gemma-1b
  namespace: inference
spec:
  # Backend selection — vllm runs on GPU via vLLM (HAMi vGPU partitioning)
  backend: vllm

  # HuggingFace model ID
  model: "google/gemma-3-1b-it"

  # Internal name used by vLLM's --served-model-name
  servedName: "gemma-1b"

  # GPU allocation via HAMi
  gpuMemMb: 5000
  gpuMemPercentage: 35
  gpuCorePercent: 35

  # Quantization — AWQ INT4 chosen for VRAM efficiency
  # Note: Verify google/gemma-3-1b-it has an AWQ variant on HF Hub.
  # If not, use a community quant like: TheBloke/gemma-3-1b-it-AWQ
  quantization: "awq"
  maxModelLen: 2048
  gpuMemUtilization: "0.85"

  # Pod sizing
  cpuRequest: "1"
  cpuLimit: "2"
  memoryRequest: "4Gi"
  memoryLimit: "8Gi"

  # Replicas
  minReplicas: 1
  maxReplicas: 1

  # Alias shown in Open WebUI dropdown
  litellmAlias: "gemma-1b-fast"
