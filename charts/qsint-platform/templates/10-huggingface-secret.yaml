---
# HuggingFace access token — required for gated models like Gemma.
#
# Create the actual secret BEFORE syncing this manifest:
#
#   kubectl create secret generic huggingface-token \
#     -n inference \
#     --from-literal=token=hf_YOUR_TOKEN_HERE
#
# This file is a placeholder so ArgoCD doesn't fail. The empty token works for
# non-gated models (SmolLM3). For Gemma, you MUST replace with your real token.
#
# For production: use External Secrets Operator + Vault / AWS Secrets Manager / etc.
apiVersion: v1
kind: Secret
metadata:
  name: huggingface-token
  namespace: inference
  annotations:
    # Prevent ArgoCD from overwriting if user already created it manually
    argocd.argoproj.io/sync-options: Replace=false
type: Opaque
stringData:
  token: ""
