---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workloads
  namespace: argocd
  annotations:
    # Sync wave 1: workloads sync after platform is ready
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: qsint-ai-platform
  source:
    repoURL: https://github.com/bogdancstrike/qsint-ai-platform.git
    targetRevision: main
    path: workloads
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: inference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
