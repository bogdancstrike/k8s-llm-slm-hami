---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    # Sync wave: platform syncs first
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: qsint-ai-platform
  source:
    # CHANGE THIS to your fork's URL
    repoURL: https://github.com/bogdancstrike/qsint-ai-platform.git
    targetRevision: main
    path: platform
    directory:
      recurse: true
      # Exclude argocd/ subdir (it bootstraps itself, would cause recursion)
      exclude: 'argocd/*'
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # KServe + KRO CRDs are large — needed
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
