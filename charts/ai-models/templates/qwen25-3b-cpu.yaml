---
# Qwen2.5-3B-Instruct — CPU inference via llama.cpp (GGUF, no GPU requested).
# Runs alongside the GPU models without contending for vRAM.
apiVersion: kro.run/v1alpha1
kind: InferenceEndpoint
metadata:
  name: qwen25-3b-cpu
  namespace: {{ .Values.namespace }}
spec:
  backend: llamacpp

  # GGUF filename in the model-cache PVC, and where to fetch it on first boot.
  modelFile: "qwen2.5-3b-instruct-q4_k_m.gguf"
  modelUrl: "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf"
  servedName: "qwen25-3b-cpu"

  # llama.cpp tuning
  ctxSize: 2048
  threads: 6           # physical cores (4–8 sweet spot)
  batchSize: 512

  cpuRequest: "4"
  cpuLimit: "8"
  memoryRequest: "4Gi"
  memoryLimit: "8Gi"

  minReplicas: 1
  maxReplicas: 1

  litellmAlias: "qwen-3b-cpu"
{{- include "ai-models.registerJob" (dict
      "name" "qwen25-3b-cpu" "alias" "qwen-3b-cpu" "served" "qwen25-3b-cpu"
      "backend" "llamacpp" "desc" "Qwen2.5-3B-Instruct GGUF via KServe + llama.cpp CPU"
      "root" $) }}
