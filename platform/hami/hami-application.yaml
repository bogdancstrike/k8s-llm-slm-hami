---
# HAMi is installed as an ArgoCD Application pointing to the Helm chart.
# This way we manage the upstream chart version + custom values from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hami
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: qsint-ai-platform
  source:
    repoURL: https://project-hami.github.io/HAMi/
    chart: hami
    targetRevision: 2.4.0
    helm:
      releaseName: hami
      valuesObject:
        # Scheduler runs alongside default-scheduler; pods opt-in via schedulerName
        scheduler:
          # Use the official HAMi scheduler image
          kubeScheduler:
            image: registry.k8s.io/kube-scheduler
            imageTag: v1.28.0
          # Keep extender as deployment, not daemon
          extender:
            replicas: 1
          # Important: enable GPU sharing features
          customWebhook:
            enabled: true

        # Device plugin runs on every node with NVIDIA GPU
        devicePlugin:
          # Set explicit GPU memory in MB for partitioning calculations
          # RTX 3080 = 10240 MB total
          deviceMemoryScaling: 1
          # How many vGPUs to expose per physical GPU
          deviceSplitCount: 10
          # Run only on nodes labeled gpu=true (set in our cluster)
          nodeSelector:
            gpu: "true"
          # Tolerate the standard NVIDIA taint if present
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule

        # Disable MIG (not supported on RTX 3080 anyway — Volta+ workstation cards only)
        mig:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: hami-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
