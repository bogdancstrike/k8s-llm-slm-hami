---
# TinyLlama 1.1B AWQ — second public GPU model exposed as the local "quality" slot.
#
# vRAM budget:
#   Weights (AWQ INT4):       ~1.8 GB
#   KV cache (max_len=2048):  ~1.0 GB
#   Activations + CUDA ctx:   ~1.8 GB
#   ─────────────────────────────────
#   Total:                    ~4.6 GB  → fits in 5GB HAMi slice (tight)
#
# Not gated — no HuggingFace token required. Public model.
apiVersion: kro.run/v1alpha1
kind: InferenceEndpoint
metadata:
  name: smollm3-3b
  namespace: inference
spec:
  # Backend selection — GPU inference via vLLM
  backend: vllm

  model: "TheBloke/TinyLlama-1.1B-Chat-v0.3-AWQ"
  servedName: "tinyllama-1.1b-chat-v03"

  gpuMemMb: 5000
  gpuMemPercentage: 30
  gpuCorePercent: 35

  quantization: "awq"
  maxModelLen: 1024
  gpuMemUtilization: "0.65"

  cpuRequest: "1"
  cpuLimit: "2"
  memoryRequest: "4Gi"
  memoryLimit: "8Gi"

  minReplicas: 1
  maxReplicas: 1

  litellmAlias: "smollm3-3b-quality"
