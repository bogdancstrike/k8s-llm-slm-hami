---
# PodMonitor for vLLM — scrapes /metrics on port 8000 of all InferenceService pods.
#
# Why PodMonitor instead of ServiceMonitor?
# KServe InferenceService creates pods with the label
# `serving.kserve.io/inferenceservice=<name>`. We want to scrape all of them
# regardless of which model they serve. PodMonitor is the cleaner choice when
# selecting by pod labels directly.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm-inference-pods
  namespace: {{ .Values.namespace }}
  labels:
    # Match the kube-prometheus-stack Prometheus selector
    release: kube-prom-stack
spec:
  namespaceSelector:
    matchNames:
      - inference
  selector:
    matchExpressions:
      - key: serving.kserve.io/inferenceservice
        operator: Exists
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
      # vLLM uses standard Prometheus format
      scheme: http
      # Add useful labels to scraped metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_serving_kserve_io_inferenceservice]
          targetLabel: inference_service
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
