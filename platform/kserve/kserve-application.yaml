---
# KServe in RawDeployment mode — skips Knative for simpler PoC.
# RawDeployment uses standard K8s Deployment + Service + HPA.
#
# Cert-manager is a prerequisite. Install separately:
#   helm install cert-manager jetstack/cert-manager --namespace cert-manager \
#     --create-namespace --set installCRDs=true
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve-crd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: qsint-ai-platform
  source:
    repoURL: oci://ghcr.io/kserve/charts
    chart: kserve-crd
    targetRevision: v0.13.0
    helm:
      releaseName: kserve-crd
  destination:
    server: https://kubernetes.default.svc
    namespace: kserve
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: qsint-ai-platform
  source:
    repoURL: oci://ghcr.io/kserve/charts
    chart: kserve
    targetRevision: v0.13.0
    helm:
      releaseName: kserve
      valuesObject:
        kserve:
          controller:
            # RawDeployment mode — no Knative dependency
            deploymentMode: "RawDeployment"
            gateway:
              # Use Istio if installed, otherwise fall back to ClusterIP/NodePort
              # For PoC we expose via NodePort directly on Services
              ingressGateway:
                className: "istio"
                createGateway: false
            resources:
              requests:
                cpu: 100m
                memory: 200Mi
              limits:
                cpu: 500m
                memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: kserve
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
