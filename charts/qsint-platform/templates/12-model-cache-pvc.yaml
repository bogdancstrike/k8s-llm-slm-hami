---
# Shared PVC for HuggingFace/GGUF model cache across all inference pods.
# MicroK8s hostpath is RWO. On this single-node PoC, multiple pods can still
# mount the volume because they all land on the same node.
# Sized for ~10 small AWQ models (~3GB each) + overhead.
#
# IMPORTANT: Your CSI driver must support ReadWriteMany. Options:
#   - NFS provisioner (simplest for homelab)
#   - Longhorn with RWX volumes
#   - Rook/Ceph CephFS
#
# If your storage class is RWO only, change accessMode to ReadWriteOnce and
# create one PVC per InferenceService (loses cache sharing — acceptable for PoC).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache-pvc
  namespace: inference
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: microk8s-hostpath
