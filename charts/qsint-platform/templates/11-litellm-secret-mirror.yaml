---
# Copy of LiteLLM master key in the inference namespace.
#
# Why? KRO's litellmregister Job runs in the same namespace as the InferenceEndpoint
# (inference), but the original secret lives in ai-platform. Kubernetes Secrets are
# namespace-scoped, so we mirror it here.
#
# Production alternative: External Secrets Operator with ClusterSecretStore — single
# source of truth in Vault, replicated to all namespaces that need it.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: inference
type: Opaque
stringData:
  # MUST match the value in platform/litellm/litellm.yaml
  LITELLM_MASTER_KEY: "sk-litellm-master-change-me"
