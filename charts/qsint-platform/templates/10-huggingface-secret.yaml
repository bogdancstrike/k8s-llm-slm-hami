---
# HuggingFace access token — required for gated models like Gemma.
#
# Create the actual secret before installing this chart:
#
#   kubectl create secret generic huggingface-token \
#     -n inference \
#     --from-literal=token=hf_YOUR_TOKEN_HERE
#
# This placeholder allows non-gated models to run without a token. For gated
# models, replace the empty value with a real token before installation.
#
# For production: use External Secrets Operator + Vault / AWS Secrets Manager / etc.
apiVersion: v1
kind: Secret
metadata:
  name: huggingface-token
  namespace: inference
type: Opaque
stringData:
  token: ""
